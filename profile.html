<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Профиль — AnimeDle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main-content" class="page">
  <h1>Профиль</h1>

  <section aria-labelledby="total-h">
    <h2 id="total-h">Статистика</h2>
    <div class="stats">
      <div class="stat"><b id="st-played">0</b>сыграно</div>
      <div class="stat"><b id="st-wins">0</b>побед</div>
      <div class="stat"><b id="st-rate">0%</b>процент побед</div>
      <div class="stat"><b id="st-streak">0</b>текущая серия</div>
      <div class="stat"><b id="st-best">0</b>лучшая серия</div>
    </div>
  </section>

  <section aria-labelledby="dist-h">
    <h2 id="dist-h">Победы по числу попыток</h2>
    <div id="dist" class="dist"></div>
  </section>
</main>
<script type="module" src="js/common.js"></script>
<script type="module" src="js/profile.js"></script>
</body>
</html>
